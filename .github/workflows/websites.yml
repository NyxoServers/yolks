name: build websites

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - master


jobs:
  push:
    name: "yolks:${{ matrix.websites }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        websites:
            - nginx_multiegg
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Get Commit info
        run: |
          COMMIT_COUNT=${{ github.run_number }} && echo "$COMMIT_COUNT" > websites/commit_count.txt
          COMMIT_MESSAGE="${{ github.event.head_commit.message || 'No commit message available' }}" && echo "$COMMIT_MESSAGE" > websites/commit_message.txt
      - uses: docker/build-push-action@v4
        with:
          context: ./websites/${{ matrix.websites }}
          file: ./websites/${{ matrix.websites }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nyxoservers/yolks:${{ matrix.websites }}
